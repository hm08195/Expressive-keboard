name: Build Android APK

on:
  push:
    paths:
      - "Expressive-Keyboard-modified.zip"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project archive
        run: |
          test -f Expressive-Keyboard-modified.zip
          unzip -q Expressive-Keyboard-modified.zip
          test -f Expressive-Keyboard-main/gradlew
          chmod +x Expressive-Keyboard-main/gradlew

      - name: Build release APK
        working-directory: Expressive-Keyboard-main
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Expressive-Keyboard-release-apk
          path: Expressive-Keyboard-main/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
